<div id="reportsPage" class="page">
  <div class="reports-container">

    <div class="card rpt-filter-card">
      <div class="card-header">
        <div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;margin-right:8px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Enterprise Reports</div>
      </div>
      <div class="rpt-filter-panel">
        <div class="rpt-filter-row">
          <div class="rpt-filter-group">
            <label>Report Type</label>
            <select class="form-control" id="rptType" onchange="onRptTypeChange()"></select>
          </div>
          <div class="rpt-filter-group">
            <label>Division</label>
            <select class="form-control" id="rptDivision" onchange="onRptDivisionChange()">
              <option value="">All Divisions</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Section</label>
            <select class="form-control" id="rptSection" onchange="onRptSectionChange()">
              <option value="">All Sections</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Department</label>
            <select class="form-control" id="rptDepartment" onchange="onRptDepartmentChange()">
              <option value="">All Departments</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Machine</label>
            <select class="form-control" id="rptMachine" onchange="onRptMachineChange()">
              <option value="">All Machines</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Machine Number</label>
            <select class="form-control" id="rptMachineNumber">
              <option value="">All</option>
            </select>
          </div>
        </div>
        <div class="rpt-filter-row">
          <div class="rpt-filter-group">
            <label>Technician</label>
            <select class="form-control" id="rptTechnician">
              <option value="">All Technicians</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Maintenance Type</label>
            <select class="form-control" id="rptMaintType">
              <option value="All">All Types</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Priority</label>
            <select class="form-control" id="rptPriority">
              <option value="">All Priorities</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>Status</label>
            <select class="form-control" id="rptStatus">
              <option value="">All Statuses</option>
            </select>
          </div>
          <div class="rpt-filter-group">
            <label>From Date</label>
            <input type="date" class="form-control" id="rptFromDate">
          </div>
          <div class="rpt-filter-group">
            <label>To Date</label>
            <input type="date" class="form-control" id="rptToDate">
          </div>
        </div>
        <div class="rpt-filter-actions">
          <button class="btn btn-primary" onclick="generateReport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Generate Report</button>
          <button class="btn btn-secondary" onclick="resetFilters()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Reset</button>
          <button class="btn btn-success" onclick="exportPDF()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export PDF</button>
          <button class="btn btn-success" onclick="exportExcel()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg> Export Excel</button>
          <button class="btn btn-info" onclick="exportCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Export CSV</button>
          <button class="btn btn-secondary" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:6px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
        </div>
      </div>
    </div>

    <div id="rptKpiCards" class="rpt-kpi-row" style="display:none"></div>

    <div id="rptTableCard" class="card" style="display:none;margin-top:16px">
      <div class="card-header">
        <div class="card-title" id="rptTableTitle">Report Data</div>
        <div class="card-actions">
          <span id="rptRecordCount" class="rpt-badge"></span>
        </div>
      </div>
      <div class="rpt-table-wrapper">
        <table class="rpt-table" id="rptTable">
          <thead id="rptTableHead"></thead>
          <tbody id="rptTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="rptChartsCard" class="card" style="display:none;margin-top:16px">
      <div class="card-header">
        <div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;margin-right:8px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Analytics & Charts</div>
      </div>
      <div class="rpt-charts-grid" id="rptChartsGrid"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script>
var rptData = null;
var rptFilterOptions = null;
var rptChartsLoaded = false;

function loadReportsData() {
  loadRptFilterOptions();
}

function loadRptFilterOptions() {
  google.script.run
    .withSuccessHandler(function(opts) {
      rptFilterOptions = opts;
      populateRptSelect('rptType', opts.reportTypes.map(function(r) { return { value: r.value, label: r.label }; }), 'Select Report Type');
      populateRptSelect('rptDivision', opts.divisions.map(function(d) { return { value: d, label: d }; }), 'All Divisions');
      populateRptSelect('rptSection', opts.sections.map(function(s) { return { value: s, label: s }; }), 'All Sections');
      populateRptSelect('rptDepartment', opts.departments.map(function(d) { return { value: d, label: d }; }), 'All Departments');
      populateRptSelect('rptMachine', opts.machines.map(function(m) { return { value: m, label: m }; }), 'All Machines');
      populateRptSelect('rptMachineNumber', opts.machineNumbers.map(function(n) { return { value: n, label: n }; }), 'All');
      populateRptSelect('rptTechnician', opts.technicians.map(function(t) { return { value: t, label: t }; }), 'All Technicians');
      populateRptSelect('rptMaintType', opts.maintenanceTypes.map(function(m) { return { value: m, label: m }; }), 'All Types');
      populateRptSelect('rptPriority', opts.priorities.map(function(p) { return { value: p, label: p }; }), 'All Priorities');
      populateRptSelect('rptStatus', opts.statuses.map(function(s) { return { value: s, label: s }; }), 'All Statuses');
      var d = new Date(); var y = d.getFullYear();
      document.getElementById('rptFromDate').value = y + '-01-01';
      document.getElementById('rptToDate').value = formatDate(d);
    })
    .withFailureHandler(function(err) { showToast('Failed to load filter options', 'error'); })
    .getReportFilterOptions();
}

function initRptCharts() {
  if (rptChartsLoaded) return;
  var script = document.createElement('script');
  script.src = 'https://www.gstatic.com/charts/loader.js';
  script.onload = function() {
    google.charts.load('current', { packages: ['corechart', 'bar'] });
    google.charts.setOnLoadCallback(function() { rptChartsLoaded = true; });
  };
  document.head.appendChild(script);
}

function populateRptSelect(id, items, placeholder) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<option value="">' + placeholder + '</option>';
  items.forEach(function(item) {
    var opt = document.createElement('option');
    opt.value = item.value;
    opt.textContent = item.label || item.value;
    el.appendChild(opt);
  });
}

function onRptDivisionChange() {
  var div = document.getElementById('rptDivision').value;
  var sections = [];
  var depts = [];
  if (div) {
    google.script.run
      .withSuccessHandler(function(filtered) {
        populateRptSelect('rptSection', filtered.sections.map(function(s) { return { value: s, label: s }; }), 'All Sections');
        populateRptSelect('rptDepartment', filtered.departments.map(function(d) { return { value: d, label: d }; }), 'All Departments');
      })
      .withFailureHandler(function() {})
      .getFilteredByDivision(div);
  } else {
    populateRptSelect('rptSection', (rptFilterOptions.sections || []).map(function(s) { return { value: s, label: s }; }), 'All Sections');
    populateRptSelect('rptDepartment', (rptFilterOptions.departments || []).map(function(d) { return { value: d, label: d }; }), 'All Departments');
  }
  populateRptSelect('rptMachine', (rptFilterOptions.machines || []).map(function(m) { return { value: m, label: m }; }), 'All Machines');
  populateRptSelect('rptMachineNumber', (rptFilterOptions.machineNumbers || []).map(function(n) { return { value: n, label: n }; }), 'All');
}

function onRptSectionChange() {
  var sec = document.getElementById('rptSection').value;
  var div = document.getElementById('rptDivision').value;
  if (sec || div) {
    google.script.run
      .withSuccessHandler(function(filtered) {
        populateRptSelect('rptDepartment', filtered.departments.map(function(d) { return { value: d, label: d }; }), 'All Departments');
        populateRptSelect('rptMachine', filtered.machines.map(function(m) { return { value: m, label: m }; }), 'All Machines');
        populateRptSelect('rptMachineNumber', filtered.machineNumbers.map(function(n) { return { value: n, label: n }; }), 'All');
      })
      .withFailureHandler(function() {})
      .getFilteredBySection(sec, div);
  } else {
    onRptDivisionChange();
  }
}

function onRptDepartmentChange() {
  var dept = document.getElementById('rptDepartment').value;
  if (dept) {
    google.script.run
      .withSuccessHandler(function(filtered) {
        populateRptSelect('rptMachine', filtered.machines.map(function(m) { return { value: m, label: m }; }), 'All Machines');
        populateRptSelect('rptMachineNumber', filtered.machineNumbers.map(function(n) { return { value: n, label: n }; }), 'All');
      })
      .withFailureHandler(function() {})
      .getFilteredByDepartment(dept);
  } else {
    onRptSectionChange();
  }
}

function onRptMachineChange() {
  var mach = document.getElementById('rptMachine').value;
  if (mach) {
    google.script.run
      .withSuccessHandler(function(filtered) {
        populateRptSelect('rptMachineNumber', filtered.machineNumbers.map(function(n) { return { value: n, label: n }; }), 'All');
      })
      .withFailureHandler(function() {})
      .getMachineNumbersForMachine(mach);
  } else {
    populateRptSelect('rptMachineNumber', (rptFilterOptions.machineNumbers || []).map(function(n) { return { value: n, label: n }; }), 'All');
  }
}

function onRptTypeChange() {}

function getFilters() {
  return {
    reportType: document.getElementById('rptType').value,
    division: document.getElementById('rptDivision').value,
    section: document.getElementById('rptSection').value,
    department: document.getElementById('rptDepartment').value,
    machine: document.getElementById('rptMachine').value,
    machineNumber: document.getElementById('rptMachineNumber').value,
    technician: document.getElementById('rptTechnician').value,
    maintenanceType: document.getElementById('rptMaintType').value,
    priority: document.getElementById('rptPriority').value,
    status: document.getElementById('rptStatus').value,
    fromDate: document.getElementById('rptFromDate').value,
    toDate: document.getElementById('rptToDate').value
  };
}

function generateReport() {
  var filters = getFilters();
  if (!filters.reportType) { showToast('Please select a report type', 'warning'); return; }
  showLoading(true);
  initRptCharts();
  google.script.run
    .withSuccessHandler(function(data) {
      rptData = data;
      showLoading(false);
      if (!data || !data.rows || data.rows.length === 0) {
        document.getElementById('rptKpiCards').style.display = 'none';
        document.getElementById('rptTableCard').style.display = 'none';
        document.getElementById('rptChartsCard').style.display = 'none';
        showToast('No data found for selected filters', 'info');
        return;
      }
      renderRptKpi(data.kpi);
      renderRptTable(data.columns, data.rows);
      renderRptCharts(data.charts);
      document.getElementById('rptKpiCards').style.display = 'flex';
      document.getElementById('rptTableCard').style.display = 'block';
      document.getElementById('rptChartsCard').style.display = 'block';
    })
    .withFailureHandler(function(err) { showLoading(false); showToast('Error generating report: ' + err.message, 'error'); })
    .getReportData(filters);
}

function resetFilters() {
  loadRptFilterOptions();
  document.getElementById('rptKpiCards').style.display = 'none';
  document.getElementById('rptTableCard').style.display = 'none';
  document.getElementById('rptChartsCard').style.display = 'none';
  rptData = null;
}

function renderRptKpi(kpi) {
  if (!kpi) return;
  var cards = [
    { label: 'Total Jobs', value: kpi.totalJobs || 0, cls: 'stat-primary', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>' },
    { label: 'Breakdown Jobs', value: kpi.breakdownJobs || 0, cls: 'stat-danger', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' },
    { label: 'Preventive Jobs', value: kpi.preventiveJobs || 0, cls: 'stat-success', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><polyline points="20 6 9 17 4 12"/></svg>' },
    { label: 'Total Downtime', value: displayDuration(kpi.totalDowntime || 0), cls: 'stat-warning', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
    { label: 'Total Waiting', value: displayDuration(kpi.totalWaiting || 0), cls: 'stat-pending', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' },
    { label: 'Total Working', value: displayDuration(kpi.totalWorking || 0), cls: 'stat-info', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
    { label: 'MTTR', value: kpi.mttr !== null && kpi.mttr !== undefined ? kpi.mttr + ' hrs' : 'N/A', cls: 'stat-approved', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' },
    { label: 'MTBF', value: kpi.mtbf !== null && kpi.mtbf !== undefined ? kpi.mtbf + ' hrs' : 'N/A', cls: 'stat-primary', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' },
    { label: 'Availability', value: kpi.availability !== null && kpi.availability !== undefined ? kpi.availability + '%' : 'N/A', cls: 'stat-success', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="rpt-kpi-icon"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' }
  ];
  document.getElementById('rptKpiCards').innerHTML = cards.map(function(c) {
    return '<div class="stat-card ' + c.cls + '"><div class="stat-inner"><div class="stat-icon">' + c.icon + '</div><div class="stat-info"><h3>' + c.value + '</h3><p>' + c.label + '</p></div></div></div>';
  }).join('');
}

function renderRptTable(columns, rows) {
  if (!columns || !rows) return;
  var title = document.getElementById('rptType').options[document.getElementById('rptType').selectedIndex]?.text || 'Report';
  document.getElementById('rptTableTitle').textContent = title;
  document.getElementById('rptRecordCount').textContent = rows.length + ' records';

  var thead = document.getElementById('rptTableHead');
  var tbody = document.getElementById('rptTableBody');
  thead.innerHTML = '<tr>' + columns.map(function(c) { return '<th>' + c.label + '</th>'; }).join('') + '</tr>';

  tbody.innerHTML = rows.map(function(row) {
    return '<tr>' + columns.map(function(col) {
      var val = row[col.key];
      if (val === null || val === undefined) val = '';
      if (col.type === 'duration' && typeof val === 'number') val = displayDuration(val);
      else if (col.type === 'datetime' && val) {
        try { var d = new Date(val); if (!isNaN(d.getTime())) val = formatDate(d) + ' ' + formatTime(d); } catch(e) {}
      }
      else if (col.key === 'CurrentStatus' || col.key === 'ApprovalStatus') {
        var slc = val.toLowerCase();
        var badgeCls = 'rpt-badge-default';
        if (slc === 'closed' || slc === 'completed' || slc === 'approved') badgeCls = 'rpt-badge-success';
        else if (slc === 'open' || slc === 'pending') badgeCls = 'rpt-badge-warning';
        else if (slc === 'running' || slc === 'in progress') badgeCls = 'rpt-badge-info';
        else if (slc === 'rejected' || slc === 'cancelled') badgeCls = 'rpt-badge-danger';
        return '<td><span class="rpt-badge ' + badgeCls + '">' + val + '</span></td>';
      }
      return '<td>' + val + '</td>';
    }).join('') + '</tr>';
  }).join('');
}

function renderRptCharts(charts) {
  if (!charts) return;
  var container = document.getElementById('rptChartsGrid');
  var chartDefs = [
    { title: 'Breakdown Trend', id: 'rptChartBreakdownTrend', type: 'line' },
    { title: 'Downtime Trend (hrs)', id: 'rptChartDowntimeTrend', type: 'line' },
    { title: 'Breakdown Category', id: 'rptChartBreakdownCategory', type: 'pie' },
    { title: 'Department Performance', id: 'rptChartDeptPerf', type: 'hbar' },
    { title: 'Machine Performance', id: 'rptChartMachinePerf', type: 'hbar' },
    { title: 'Technician Performance', id: 'rptChartTechPerf', type: 'hbar' },
    { title: 'Monthly Maintenance', id: 'rptChartMonthly', type: 'column' },
    { title: 'Availability Trend', id: 'rptChartAvailability', type: 'line' }
  ];

  container.innerHTML = chartDefs.map(function(cd) {
    return '<div class="rpt-chart-card"><div class="rpt-chart-title">' + cd.title + '</div><div class="rpt-chart-canvas" id="' + cd.id + '"></div></div>';
  }).join('');

  if (!rptChartsLoaded) {
    setTimeout(function() { renderRptCharts(charts); }, 1000);
    return;
  }

  var chartDataMap = {
    rptChartBreakdownTrend: { data: charts.breakdownTrend, type: 'line' },
    rptChartDowntimeTrend: { data: charts.downtimeTrend, type: 'line' },
    rptChartBreakdownCategory: { data: charts.breakdownCategory, type: 'pie' },
    rptChartDeptPerf: { data: charts.departmentPerformance, type: 'hbar' },
    rptChartMachinePerf: { data: charts.machinePerformance, type: 'hbar' },
    rptChartTechPerf: { data: charts.technicianPerformance, type: 'hbar' },
    rptChartMonthly: { data: charts.monthlyMaintenance, type: 'column' },
    rptChartAvailability: { data: charts.availabilityTrend, type: 'line' }
  };

  Object.keys(chartDataMap).forEach(function(id) {
    var info = chartDataMap[id];
    var el = document.getElementById(id);
    if (!el || !info.data || info.data.length === 0) return;
    drawRptChart(el, info.data, info.type, id.replace('rptChart', ''));
  });
}

function drawRptChart(container, data, type, title) {
  try {
    if (data.length === 0) { container.innerHTML = '<div class="rpt-no-data">No data</div>'; return; }
    var tc = getThemeColors();
    var dt = new google.visualization.DataTable();
    if (type === 'pie') {
      dt.addColumn('string', 'Category');
      dt.addColumn('number', 'Count');
      dt.addRows(data.map(function(d) { return [d.label, d.value]; }));
      var chart = new google.visualization.PieChart(container);
      chart.draw(dt, {
        width: '100%', height: 260, backgroundColor: tc.bg,
        legend: { textStyle: { color: tc.label }, position: 'right' },
        titleTextStyle: { color: tc.title },
        chartArea: { width: '70%', height: '80%' },
        colors: tc.palette
      });
    } else if (type === 'hbar') {
      dt.addColumn('string', 'Label');
      dt.addColumn('number', 'Count');
      dt.addRows(data.slice(0, 15).map(function(d) { return [d.label, d.value]; }));
      var chart = new google.visualization.BarChart(container);
      chart.draw(dt, {
        width: '100%', height: Math.max(200, data.slice(0, 15).length * 28),
        backgroundColor: tc.bg, legend: { position: 'none' },
        hAxis: { textStyle: { color: tc.label }, gridlines: { color: tc.grid } },
        vAxis: { textStyle: { color: tc.label } },
        chartArea: { width: '55%', height: '80%' },
        colors: [tc.primary]
      });
    } else if (type === 'column') {
      dt.addColumn('string', 'Period');
      dt.addColumn('number', 'Jobs');
      dt.addRows(data.map(function(d) { return [d.label, d.value]; }));
      var chart = new google.visualization.ColumnChart(container);
      chart.draw(dt, {
        width: '100%', height: 260, backgroundColor: tc.bg,
        legend: { position: 'none' },
        hAxis: { textStyle: { color: tc.label }, slantedText: true, slantedTextAngle: 45, gridlines: { color: tc.grid } },
        vAxis: { textStyle: { color: tc.label }, gridlines: { color: tc.grid } },
        chartArea: { width: '85%', height: '70%' },
        colors: [tc.primary]
      });
    } else {
      dt.addColumn('string', 'Period');
      dt.addColumn('number', 'Value');
      dt.addRows(data.map(function(d) { return [d.label, d.value]; }));
      var chart = new google.visualization.LineChart(container);
      chart.draw(dt, {
        width: '100%', height: 260, backgroundColor: tc.bg,
        legend: { position: 'none' },
        hAxis: { textStyle: { color: tc.label }, slantedText: true, slantedTextAngle: 45, gridlines: { color: tc.grid } },
        vAxis: { textStyle: { color: tc.label }, gridlines: { color: tc.grid } },
        chartArea: { width: '85%', height: '70%' },
        colors: [tc.secondary],
        pointSize: 5,
        lineWidth: 2
      });
    }
  } catch(e) {
    container.innerHTML = '<div class="rpt-no-data">Chart error: ' + e.message + '</div>';
  }
}

function getThemeColors() {
  var isLight = (document.documentElement.getAttribute('data-theme') || 'dark') === 'light';
  return {
    bg: isLight ? '#ffffff' : '#151829',
    label: isLight ? '#52566e' : '#9498b8',
    title: isLight ? '#1a1c2e' : '#eef0f6',
    grid: isLight ? '#e8ecf1' : '#1e2140',
    primary: getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#6366f1',
    secondary: getComputedStyle(document.documentElement).getPropertyValue('--orange').trim() || '#f97316',
    palette: ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#f97316']
  };
}

function exportCSV() {
  if (!rptData || !rptData.rows || rptData.rows.length === 0) { showToast('No data to export', 'warning'); return; }
  var cols = rptData.columns;
  var csv = '\uFEFF';
  csv += cols.map(function(c) { return '"' + c.label.replace(/"/g, '""') + '"'; }).join(',') + '\n';
  rptData.rows.forEach(function(row) {
    csv += cols.map(function(col) {
      var val = row[col.key];
      if (val === null || val === undefined) val = '';
      if (col.type === 'duration' && typeof val === 'number') val = displayDuration(val);
      val = String(val).replace(/"/g, '""');
      return '"' + val + '"';
    }).join(',') + '\n';
  });
  downloadBlob(csv, 'text/csv;charset=utf-8', 'report.csv');
}

function exportExcel() {
  exportCSV();
}

function exportPDF() {
  window.print();
}

function downloadBlob(content, mime, filename) {
  var blob = new Blob([content], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
}

function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function formatTime(d) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
</script>
