<div id="machinepassportPage" class="page">
  <div class="passport-container">
    <div class="card" id="passportHeader">
      <div class="passport-header" id="passportHeaderContent">
        <div class="passport-photo" id="passportPhotoWrap">
          <div class="passport-photo-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>
        </div>
        <div class="passport-info" id="passportInfo"></div>
        <div class="passport-actions">
          <button class="btn btn-sm btn-primary" onclick="exportPassportPDF()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PDF</button>
          <button class="btn btn-sm btn-success" onclick="exportPassportCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> CSV</button>
          <button class="btn btn-sm btn-secondary" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:4px"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
        </div>
      </div>
    </div>

    <div class="passport-kpi-row" id="passportKpi"></div>

    <div class="passport-search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="passport-search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="passport-search-input" id="passportSearch" placeholder="Search by Job Card, Complaint, Technician, Date, Type..." oninput="filterPassportTable()">
    </div>

    <div class="passport-tabs">
      <button class="passport-tab active" data-tab="history" onclick="switchPassportTab('history', this)">Job History</button>
      <button class="passport-tab" data-tab="spares" onclick="switchPassportTab('spares', this)">Spare Parts</button>
      <button class="passport-tab" data-tab="charts" onclick="switchPassportTab('charts', this)">Charts</button>
      <button class="passport-tab" data-tab="timeline" onclick="switchPassportTab('timeline', this)">Timeline</button>
      <button class="passport-tab" data-tab="documents" onclick="switchPassportTab('documents', this)">Documents</button>
    </div>

    <div class="passport-tab-content" id="passportTabHistory">
      <div class="card">
        <div class="card-header"><div class="card-title">Job Card History</div><div class="card-actions"><span class="passport-count" id="passportJobCount"></span></div></div>
        <div class="passport-table-wrap">
          <table class="passport-table" id="passportJobTable">
            <thead><tr id="passportJobHead"></tr></thead>
            <tbody id="passportJobBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="passport-tab-content" id="passportTabSpares" style="display:none">
      <div class="card">
        <div class="card-header"><div class="card-title">Spare Parts History</div><div class="card-actions"><span class="passport-count" id="passportSparesCount"></span></div></div>
        <div class="passport-table-wrap">
          <table class="passport-table" id="passportSparesTable">
            <thead><tr><th>Date</th><th>Job Card</th><th>Part Name</th><th>Qty</th><th>Cost</th><th>Technician</th></tr></thead>
            <tbody id="passportSparesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="passport-tab-content" id="passportTabCharts" style="display:none">
      <div class="passport-charts-grid">
        <div class="card"><div class="card-header"><div class="card-title">Monthly Breakdown Trend</div></div><div class="passport-chart-canvas" id="passportChartBDTrend"></div></div>
        <div class="card"><div class="card-header"><div class="card-title">Downtime Trend (hrs)</div></div><div class="passport-chart-canvas" id="passportChartDTrend"></div></div>
        <div class="card"><div class="card-header"><div class="card-title">Failure Category</div></div><div class="passport-chart-canvas" id="passportChartFCat"></div></div>
        <div class="card"><div class="card-header"><div class="card-title">MTTR Trend</div></div><div class="passport-chart-canvas" id="passportChartMTTR"></div></div>
        <div class="card"><div class="card-header"><div class="card-title">MTBF Trend</div></div><div class="passport-chart-canvas" id="passportChartMTBF"></div></div>
      </div>
    </div>

    <div class="passport-tab-content" id="passportTabTimeline" style="display:none">
      <div class="card">
        <div class="card-header"><div class="card-title">Machine Timeline</div></div>
        <div class="passport-timeline" id="passportTimeline"></div>
      </div>
    </div>

    <div class="passport-tab-content" id="passportTabDocuments" style="display:none">
      <div class="passport-docs-grid" id="passportDocs"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script>
var passportData = null;
var passportChartsReady = false;

function loadMachinePassportPage() {
  var mid = sessionStorage.getItem('passportMachineId');
  if (!mid) { showToast('No machine selected', 'error'); return; }
  loadPassportCharts();
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { showToast(data.error, 'error'); return; }
      passportData = data;
      renderPassportHeader(data.machine);
      renderPassportKpi(data.kpi);
      renderPassportJobTable(data.jobCards);
      renderPassportSparesTable(data.spareParts);
      renderPassportCharts(data.charts);
      renderPassportTimeline(data.timeline);
      renderPassportDocs(data.machine);
    })
    .withFailureHandler(function(err) { showToast('Error loading passport: ' + err.message, 'error'); })
    .getMachinePassport(mid);
}

function loadPassportCharts() {
  if (passportChartsReady) return;
  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(function() { passportChartsReady = true; });
}

function renderPassportHeader(m) {
  document.getElementById('passportInfo').innerHTML =
    '<div class="passport-name">' + esc(m.MachineName) + '</div>' +
    '<div class="passport-meta">' +
      '<span class="passport-tag">' + esc(m.MachineCode) + '</span>' +
      '<span class="passport-tag">' + esc(m.MachineNumber) + '</span>' +
      '<span class="passport-badge ' + (m.Status === 'Active' ? 'badge-success' : 'badge-warning') + '">' + esc(m.Status) + '</span>' +
      '<span class="passport-badge ' + (m.Criticality === 'Critical' ? 'badge-danger' : m.Criticality === 'High' ? 'badge-warning' : 'badge-info') + '">' + esc(m.Criticality) + '</span>' +
    '</div>' +
    '<div class="passport-details">' +
      '<div class="passport-detail-item"><span class="pdi-label">Department</span><span class="pdi-value">' + esc(m.Department) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Section</span><span class="pdi-value">' + esc(m.Section) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Division</span><span class="pdi-value">' + esc(m.Division) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Location</span><span class="pdi-value">' + esc(m.Location) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Manufacturer</span><span class="pdi-value">' + esc(m.Manufacturer) + ' ' + esc(m.Model) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Serial No</span><span class="pdi-value">' + esc(m.SerialNo) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Type</span><span class="pdi-value">' + esc(m.MachineType) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Capacity</span><span class="pdi-value">' + esc(m.Capacity) + ' / ' + esc(m.PowerRating) + '</span></div>' +
      '<div class="passport-detail-item"><span class="pdi-label">Install Date</span><span class="pdi-value">' + esc(m.InstallDate) + '</span></div>' +
    '</div>';

  if (m.MachinePhoto) {
    document.getElementById('passportPhotoWrap').innerHTML = '<img src="' + esc(m.MachinePhoto) + '" class="passport-photo-img" alt="Machine Photo">';
  }
}

function renderPassportKpi(k) {
  var cards = [
    { label: 'Total Jobs', value: k.totalJobs, cls: 'stat-primary' },
    { label: 'Open Jobs', value: k.openJobs, cls: 'stat-open' },
    { label: 'Closed Jobs', value: k.closedJobs, cls: 'stat-closed' },
    { label: 'Pending', value: k.pendingApproval, cls: 'stat-pending' },
    { label: 'Breakdown', value: k.breakdownJobs, cls: 'stat-danger' },
    { label: 'Preventive', value: k.preventiveJobs, cls: 'stat-success' },
    { label: 'Electrical', value: k.electricalJobs, cls: 'stat-info' },
    { label: 'Mechanical', value: k.mechanicalJobs, cls: 'stat-warning' },
    { label: 'Waiting', value: displayDuration(k.totalWaiting), cls: 'stat-pending' },
    { label: 'Working', value: displayDuration(k.totalWorking), cls: 'stat-info' },
    { label: 'Downtime', value: displayDuration(k.totalDowntime), cls: 'stat-warning' },
    { label: 'MTTR', value: k.mttr !== null ? k.mttr + 'h' : 'N/A', cls: 'stat-approved' },
    { label: 'MTBF', value: k.mtbf !== null ? k.mtbf + 'h' : 'N/A', cls: 'stat-primary' },
    { label: 'Availability', value: k.availability !== null ? k.availability + '%' : 'N/A', cls: (k.availability || 0) >= 95 ? 'stat-success' : 'stat-danger' },
    { label: 'Last Breakdown', value: k.lastBreakdownDate ? formatDisplayDate(k.lastBreakdownDate) : 'None', cls: 'stat-warning' },
    { label: 'Last PM', value: k.lastPMDate ? formatDisplayDate(k.lastPMDate) : 'None', cls: 'stat-info' }
  ];
  document.getElementById('passportKpi').innerHTML = cards.map(function(c) {
    return '<div class="stat-card ' + c.cls + '"><div class="stat-inner"><div class="stat-info"><h3>' + c.value + '</h3><p>' + c.label + '</p></div></div></div>';
  }).join('');
}

function renderPassportJobTable(jobs) {
  if (!jobs || jobs.length === 0) {
    document.getElementById('passportJobBody').innerHTML = '<tr><td colspan="14" class="passport-empty">No job cards found for this machine</td></tr>';
    document.getElementById('passportJobHead').innerHTML = '<th>Job Card No</th><th>Open Date</th><th>Close Date</th><th>Complaint</th>';
    return;
  }
  document.getElementById('passportJobCount').textContent = jobs.length + ' records';
  var cols = ['JobCardNo','OpenDate','CloseDate','Complaint','ComplaintCategory','BreakdownType','Priority','Technician','WaitingTime','WorkingTime','Downtime','RootCause','CorrectiveAction','ApprovalStatus','CurrentStatus'];
  var labels = ['Job Card No','Open Date','Close Date','Complaint','Category','Type','Priority','Technician','Waiting','Working','Downtime','Root Cause','Action','Approval','Status'];
  document.getElementById('passportJobHead').innerHTML = '<th>' + labels.join('</th><th>') + '</th><th>Actions</th>';
  document.getElementById('passportJobBody').innerHTML = jobs.map(function(j) {
    return '<tr>' +
      '<td><a href="#" onclick="event.preventDefault(); viewPassportJobCard(\'' + esc(j.JobCardNo) + '\')" class="passport-link">' + esc(j.JobCardNo) + '</a></td>' +
      '<td class="passport-date">' + formatDisplayDate(j.OpenDate) + '</td>' +
      '<td class="passport-date">' + formatDisplayDate(j.CloseDate) + '</td>' +
      '<td>' + esc(j.Complaint) + '</td>' +
      '<td>' + esc(j.ComplaintCategory) + '</td>' +
      '<td><span class="badge badge-' + getBadgeClass(j.BreakdownType) + '">' + esc(j.BreakdownType || 'N/A') + '</span></td>' +
      '<td><span class="badge badge-' + getPriorityClass(j.Priority) + '">' + esc(j.Priority || 'N/A') + '</span></td>' +
      '<td>' + esc(j.Technician) + '</td>' +
      '<td>' + displayDuration(j.WaitingTime) + '</td>' +
      '<td>' + displayDuration(j.WorkingTime) + '</td>' +
      '<td>' + displayDuration(j.Downtime) + '</td>' +
      '<td title="' + esc(j.RootCause) + '">' + truncate(esc(j.RootCause), 30) + '</td>' +
      '<td title="' + esc(j.CorrectiveAction) + '">' + truncate(esc(j.CorrectiveAction), 30) + '</td>' +
      '<td><span class="badge badge-' + getApprovalClass(j.ApprovalStatus) + '">' + esc(j.ApprovalStatus) + '</span></td>' +
      '<td><span class="badge badge-' + getStatusClass(j.CurrentStatus) + '">' + esc(j.CurrentStatus) + '</span></td>' +
      '<td><button class="btn btn-xs btn-primary" onclick="viewPassportJobCard(\'' + esc(j.JobCardNo) + '\')">View</button></td>' +
    '</tr>';
  }).join('');
}

function renderPassportSparesTable(spares) {
  if (!spares || spares.length === 0) {
    document.getElementById('passportSparesBody').innerHTML = '<tr><td colspan="6" class="passport-empty">No spare parts used on this machine</td></tr>';
    return;
  }
  document.getElementById('passportSparesCount').textContent = spares.length + ' records';
  document.getElementById('passportSparesBody').innerHTML = spares.map(function(s) {
    return '<tr><td class="passport-date">' + formatDisplayDate(s.date) + '</td><td>' + esc(s.jobCardNo) + '</td><td>' + esc(s.partName) + '</td><td>' + s.quantity + '</td><td>' + (s.cost ? '$' + s.cost.toFixed(2) : '-') + '</td><td>' + esc(s.technician) + '</td></tr>';
  }).join('');
}

function renderPassportCharts(charts) {
  if (!charts || !passportChartsReady) return;
  var chartMap = {
    passportChartBDTrend: { data: charts.breakdownTrend, title: 'Breakdowns per Month', type: 'line' },
    passportChartDTrend: { data: charts.downtimeTrend, title: 'Downtime Hours', type: 'line' },
    passportChartFCat: { data: charts.failureCategory, title: 'Failure Categories', type: 'pie' },
    passportChartMTTR: { data: charts.mttrTrend, title: 'MTTR (hrs)', type: 'line' },
    passportChartMTBF: { data: charts.mtbfTrend, title: 'MTBF (hrs)', type: 'line' }
  };
  var theme = getPassportThemeColors();
  Object.keys(chartMap).forEach(function(id) {
    var info = chartMap[id];
    var el = document.getElementById(id);
    if (!el || !info.data || info.data.length === 0) return;
    try {
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', 'X');
      dt.addColumn('number', info.title);
      dt.addRows(info.data.map(function(d) { return [d.label, d.value]; }));
      var chart = new (info.type === 'pie' ? google.visualization.PieChart : google.visualization.LineChart)(el);
      var opts = {
        width: '100%', height: 240, backgroundColor: theme.bg,
        legend: info.type === 'pie' ? { textStyle: { color: theme.label }, position: 'right' } : { position: 'none' },
        hAxis: { textStyle: { color: theme.label, fontSize: 10 }, slantedText: true, slantedTextAngle: 45, gridlines: { color: theme.grid } },
        vAxis: { textStyle: { color: theme.label }, gridlines: { color: theme.grid } },
        chartArea: { width: '85%', height: '72%' },
        colors: info.type === 'pie' ? theme.palette : [theme.primary],
        pointSize: 4, lineWidth: 2,
        titleTextStyle: { color: theme.title }
      };
      chart.draw(dt, opts);
    } catch(e) { el.innerHTML = '<div class="passport-empty">Chart error</div>'; }
  });
}

function renderPassportTimeline(events) {
  if (!events || events.length === 0) {
    document.getElementById('passportTimeline').innerHTML = '<div class="passport-empty">No timeline events</div>';
    return;
  }
  document.getElementById('passportTimeline').innerHTML = events.map(function(e) {
    var iconCls = e.type === 'Installation' ? 'timeline-install' :
                  e.type === 'Breakdown' ? 'timeline-bd' :
                  e.type === 'Preventive Maintenance' ? 'timeline-pm' :
                  e.type === 'Overhaul' ? 'timeline-overhaul' : 'timeline-job';
    var statusCls = e.status ? (e.status.toLowerCase() === 'closed' || e.status.toLowerCase() === 'completed' ? 'badge-success' : 'badge-warning') : '';
    return '<div class="timeline-item"><div class="timeline-dot ' + iconCls + '"></div><div class="timeline-content"><div class="timeline-date">' + formatDisplayDate(e.date) + '</div><div class="timeline-title">' + esc(e.title) + '</div><div class="timeline-meta"><span class="badge badge-sm ' + statusCls + '">' + esc(e.status || e.type) + '</span></div></div></div>';
  }).join('');
}

function renderPassportDocs(m) {
  var docFields = [
    { key: 'MachineManual', label: 'Machine Manual', icon: 'document' },
    { key: 'ElectricalDrawing', label: 'Electrical Drawing', icon: 'electrical' },
    { key: 'MechanicalDrawing', label: 'Mechanical Drawing', icon: 'mechanical' },
    { key: 'SOP', label: 'SOP', icon: 'sop' },
    { key: 'SafetyInstructions', label: 'Safety Instructions', icon: 'safety' },
    { key: 'WarrantyDocuments', label: 'Warranty Documents', icon: 'warranty' }
  ];
  var hasDocs = false;
  var html = docFields.map(function(df) {
    var url = m[df.key] || '';
    if (!url) return '<div class="passport-doc-card passport-doc-empty"><div class="pdc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="pdc-label">' + df.label + '</div><div class="pdc-status">Not uploaded</div></div>';
    hasDocs = true;
    return '<a href="' + esc(url) + '" target="_blank" class="passport-doc-card"><div class="pdc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div><div class="pdc-label">' + df.label + '</div><div class="pdc-status pdc-available">View</div></a>';
  }).join('');
  document.getElementById('passportDocs').innerHTML = hasDocs ? html : '<div class="passport-empty">No documents uploaded for this machine</div>';
}

function getPassportThemeColors() {
  var isLight = (document.documentElement.getAttribute('data-theme') || 'dark') === 'light';
  var primary = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#6366f1';
  return {
    bg: isLight ? '#ffffff' : '#151829',
    label: isLight ? '#52566e' : '#9498b8',
    title: isLight ? '#1a1c2e' : '#eef0f6',
    grid: isLight ? '#e8ecf1' : '#1e2140',
    primary: primary,
    palette: ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#f97316']
  };
}

function switchPassportTab(tab, btn) {
  document.querySelectorAll('.passport-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.passport-tab-content').forEach(function(c) { c.style.display = 'none'; });
  if (btn) btn.classList.add('active');
  document.getElementById('passportTab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
}

function filterPassportTable() {
  if (!passportData) return;
  var q = document.getElementById('passportSearch').value.toLowerCase();
  var jobs = passportData.jobCards;
  var filtered = q ? jobs.filter(function(j) {
    return (j.JobCardNo || '').toLowerCase().indexOf(q) !== -1 ||
           (j.Complaint || '').toLowerCase().indexOf(q) !== -1 ||
           (j.Technician || '').toLowerCase().indexOf(q) !== -1 ||
           (j.BreakdownType || '').toLowerCase().indexOf(q) !== -1 ||
           (j.OpenDate || '').toLowerCase().indexOf(q) !== -1;
  }) : jobs;
  renderPassportJobTable(filtered);
}

function viewPassportJobCard(jobNo) {
  sessionStorage.setItem('passportSearchJob', jobNo);
  navigateTo('jobcards');
}

function exportPassportPDF() { window.print(); }

function exportPassportCSV() {
  if (!passportData || !passportData.jobCards || passportData.jobCards.length === 0) { showToast('No data to export', 'warning'); return; }
  var csv = '\uFEFF"Machine","' + esc(passportData.machine.MachineName) + '"\n\n';
  csv += '"JobCardNo","OpenDate","CloseDate","Complaint","Category","Type","Priority","Technician","WaitingTime","WorkingTime","Downtime","RootCause","Action","ApprovalStatus","CurrentStatus"\n';
  passportData.jobCards.forEach(function(j) {
    csv += ['"' + esc(j.JobCardNo) + '"','"' + j.OpenDate + '"','"' + j.CloseDate + '"','"' + esc(j.Complaint) + '"','"' + esc(j.ComplaintCategory) + '"','"' + esc(j.BreakdownType) + '"','"' + esc(j.Priority) + '"','"' + esc(j.Technician) + '"','"' + displayDuration(j.WaitingTime) + '"','"' + displayDuration(j.WorkingTime) + '"','"' + displayDuration(j.Downtime) + '"','"' + esc(j.RootCause) + '"','"' + esc(j.CorrectiveAction) + '"','"' + esc(j.ApprovalStatus) + '"','"' + esc(j.CurrentStatus) + '"\n'].join(',');
  });
  downloadBlob(csv, 'text/csv;charset=utf-8', 'passport_' + passportData.machine.MachineCode + '.csv');
}

function formatDisplayDate(d) {
  if (!d) return '-';
  try { var dt = new Date(d); if (!isNaN(dt.getTime())) return dt.toLocaleDateString(); } catch(e) {}
  return d;
}

function getBadgeClass(t) {
  var m = (t || '').toLowerCase();
  if (m === 'breakdown' || m === 'emergency') return 'danger';
  if (m === 'preventive' || m === 'routine') return 'success';
  if (m === 'electrical') return 'info';
  if (m === 'mechanical' || m === 'corrective') return 'warning';
  return 'secondary';
}

function getPriorityClass(p) {
  var m = (p || '').toLowerCase();
  if (m === 'critical') return 'danger';
  if (m === 'high') return 'warning';
  if (m === 'medium') return 'info';
  if (m === 'low') return 'success';
  return 'secondary';
}

function getStatusClass(s) {
  var m = (s || '').toLowerCase();
  if (m === 'closed' || m === 'completed') return 'success';
  if (m === 'open') return 'warning';
  if (m === 'running' || m === 'in progress') return 'info';
  if (m === 'pending' || m === 'pending approval') return 'purple';
  if (m === 'approved') return 'success';
  if (m === 'rejected' || m === 'cancelled') return 'danger';
  return 'secondary';
}

function getApprovalClass(s) {
  var m = (s || '').toLowerCase();
  if (m === 'approved') return 'success';
  if (m === 'pending' || m === 'pending approval') return 'warning';
  if (m === 'rejected') return 'danger';
  return 'secondary';
}

function truncate(s, n) { return s && s.length > n ? s.substring(0, n) + '...' : (s || ''); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>

<style>
.passport-container { padding: 4px; max-width: 1400px; margin: 0 auto; }
.passport-header { display: flex; gap: 20px; align-items: flex-start; padding: 16px; }
.passport-photo { width: 120px; height: 120px; flex-shrink: 0; border-radius: var(--radius); overflow: hidden; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.passport-photo svg { width: 48px; height: 48px; color: var(--text-muted); }
.passport-photo-img { width: 100%; height: 100%; object-fit: cover; }
.passport-info { flex: 1; min-width: 0; }
.passport-name { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.passport-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.passport-tag { background: var(--primary-light); color: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.passport-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.passport-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; }
.passport-detail-item { display: flex; gap: 6px; font-size: 12px; }
.pdi-label { color: var(--text-muted); min-width: 80px; }
.pdi-value { color: var(--text); font-weight: 500; }
.passport-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.passport-actions .btn { white-space: nowrap; }

.passport-kpi-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.passport-kpi-row .stat-card { flex: 1; min-width: 110px; margin: 0; }
.passport-kpi-row .stat-card .stat-inner { padding: 10px 12px; }
.passport-kpi-row .stat-card .stat-inner h3 { font-size: 16px; }
.passport-kpi-row .stat-card .stat-inner p { font-size: 9px; }

.passport-search-bar { position: relative; margin: 8px 0; }
.passport-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); }
.passport-search-input { width: 100%; padding: 10px 14px 10px 38px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); font-size: 13px; }
.passport-search-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px var(--primary-light); }

.passport-tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
.passport-tab { padding: 10px 18px; background: none; border: none; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: var(--transition); }
.passport-tab:hover { color: var(--text); }
.passport-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.passport-table-wrap { overflow-x: auto; }
.passport-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.passport-table thead th { background: var(--bg-secondary); color: var(--text-muted); padding: 9px 7px; text-align: left; font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); white-space: nowrap; }
.passport-table tbody td { padding: 7px; border-bottom: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
.passport-table tbody tr:hover td { background: var(--bg-card-hover); }
.passport-table tbody tr:nth-child(even) td { background: var(--bg-primary); }
.passport-table tbody tr:nth-child(even):hover td { background: var(--bg-card-hover); }
.passport-empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 13px; }
.passport-link { color: var(--primary); text-decoration: none; }
.passport-link:hover { text-decoration: underline; }
.passport-count { font-size: 12px; color: var(--text-muted); padding: 2px 10px; background: var(--bg-secondary); border-radius: 10px; }

.passport-charts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.passport-chart-canvas { padding: 4px; min-height: 210px; }

.passport-timeline { padding: 16px; position: relative; }
.passport-timeline::before { content: ''; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-left: 52px; margin-bottom: 20px; }
.timeline-dot { position: absolute; left: 14px; top: 2px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg-card); z-index: 1; }
.timeline-install { border-color: var(--primary); background: var(--primary-light); }
.timeline-bd { border-color: var(--danger); background: var(--danger-bg); }
.timeline-pm { border-color: var(--success); background: var(--success-bg); }
.timeline-overhaul { border-color: var(--warning); background: var(--warning-bg); }
.timeline-job { border-color: var(--info); background: var(--info-bg); }
.timeline-content { background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 10px 14px; border: 1px solid var(--border); }
.timeline-date { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
.timeline-title { font-size: 13px; color: var(--text); font-weight: 500; }
.timeline-meta { margin-top: 4px; }

.passport-docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 4px; }
.passport-doc-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); text-decoration: none; transition: var(--transition); cursor: pointer; }
.passport-doc-card:hover { border-color: var(--primary); background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.passport-doc-empty { opacity: 0.5; cursor: default; }
.passport-doc-empty:hover { border-color: var(--border); background: var(--bg-card); transform: none; box-shadow: none; }
.pdc-icon svg { width: 36px; height: 36px; color: var(--primary); }
.pdc-label { font-size: 12px; font-weight: 600; color: var(--text); text-align: center; }
.pdc-status { font-size: 11px; color: var(--text-muted); }
.pdc-available { color: var(--primary); font-weight: 500; }

@media print {
  .sidebar, .topbar, .passport-tabs, .passport-actions, .passport-search-bar, .passport-tab { display: none !important; }
  .passport-chart-canvas { break-inside: avoid; }
  .passport-kpi-row .stat-card { break-inside: avoid; }
  body { background: #fff !important; }
  .passport-table tbody td { color: #000 !important; }
}
</style>
